services:
  mongodb:
    image: mongo:latest
    networks:
      - mern_network
    volumes:
      - mongodb_data:/data/db
  backend:
    build: ./mern/backend
    ports:
      - 5050:5050
    networks:
      - mern_network
    depends_on:
      - mongodb
  frontend:
    build: ./mern/frontend
    ports: 
      - 5173:5173
    networks:
      - mern_network
    depends_on:
      - backend

networks:
  mern_network:
    driver: bridge

volumes:
  mongodb_data:
